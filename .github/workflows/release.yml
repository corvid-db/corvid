name: Release

# Cut a release by pushing a tag like `v0.1.0`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build the MCP sidecar (release)
        run: cargo build --release -p corvid-mcp

      - name: Package the binary
        run: |
          tar -C target/release -czf "corvid-mcp-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" corvid-mcp

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: corvid-mcp-*-x86_64-linux.tar.gz
