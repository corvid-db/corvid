name: Release

# Cut a release by pushing a tag like `v0.1.0`. Builds the corvid-mcp binary
# for Linux (x86_64 + arm64), macOS (Intel + Apple Silicon), and Windows,
# PLUS the C ABI artifact set per platform (the corvid-ffi cdylib —
# libcorvid.so / libcorvid.dylib / corvid.dll (+ corvid.dll.lib, the MSVC
# import library) — with the committed corvid.h and the golden/ fixture
# directory binding authors can smoke their bindings against).
# The GitHub release is created only AFTER every matrix build has succeeded
# and the tag has been verified against the workspace version; the release
# job then attaches the platform archives plus a checksums.txt of their
# sha256 digests.
#
# Dry-run (no publishing, e.g. after touching this file): run the workflow
# manually from Actions with `dry_run` checked — every matrix build, the
# tag/version verification, and the sha256 checksums all execute, but the
# release/upload steps are skipped (an explicit echo marks the skip).
#
# After the GitHub release exists, the crates-io job publishes the engine
# crate to crates.io (`cargo publish -p corvid-db`) — idempotently: a
# crates.io API check skips the publish when the workspace version is
# already registered, so a re-pushed tag never fails the job.
#
# Post-release checklist: fan the new pin out to every binding repo with
# `scripts/bindings/bump.sh <TAG>` (PRs; merge each once its golden CI is
# green via --merge-when-green), then cascade the release tags with
# `scripts/bindings/bump.sh --release-after-merge <TAG>` — see
# scripts/bindings/README.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build + checksum everything, but skip the release/upload steps
        type: boolean
        default: false

# Least privilege by default; each job scopes its own grant below.
permissions: {}

# Releases must never cancel mid-run: a re-pushed tag queues behind the
# in-flight release instead of killing it (a half-published release —
# binaries attached to an unborn GitHub release — is worse than a wait).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # dry-run: build + archive only. The archive lands in the workspace
      # root as corvid-mcp-<tag>-<target>.tar.gz (or .zip on Windows) and is
      # NOT attached to any release here — that happens in the release job,
      # only once every matrix leg has succeeded.
      - name: Build & archive corvid-mcp
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: corvid-mcp
          target: ${{ matrix.target }}
          archive: corvid-mcp-$tag-$target
          dry-run: true
      - name: Upload archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: corvid-mcp-${{ matrix.target }}
          path: corvid-mcp-*
          if-no-files-found: error
      # ---- The C ABI artifact set (Phase-0 Task 8) -------------------
      # The cdylib is built for the SAME target the mcp binary just used
      # (the taiki action's `rustup target add` above covers the
      # toolchain side); the one leg the runner cannot link natively —
      # aarch64-linux on an x86_64 host — goes through `cross`, the
      # same tool the action itself installs for that leg.
      - name: Install cross (the cross-compiled linux leg)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@cross
      - name: Build the corvid-ffi cdylib
        # bash explicitly: the windows runner default is pwsh, and the
        # cross/plain dispatch is a POSIX if (Git Bash ships with the
        # runner; the MSVC toolchain env is inherited either way).
        shell: bash
        run: |
          # Distributable-library hygiene (found by corvid-c, the external
          # consumer): the dylib must carry @rpath/libcorvid.dylib as its
          # install name (the raw cdylib embeds the build machine's absolute
          # output path) and the .so a SONAME, or no external loader can
          # use the published artifact.
          case "${{ matrix.target }}" in
            *-apple-darwin)
              export RUSTFLAGS="-C link-arg=-Wl,-install_name,@rpath/libcorvid.dylib" ;;
            *-unknown-linux-*)
              export RUSTFLAGS="-C link-arg=-Wl,-soname,libcorvid.so" ;;
          esac
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build -p corvid-ffi --release --target "${{ matrix.target }}"
          else
            cargo build -p corvid-ffi --release --target "${{ matrix.target }}"
          fi
          # Verify before staging: install name / SONAME must be relocatable.
          if [ -f "target/${{ matrix.target }}/release/libcorvid.dylib" ]; then
            otool -D "target/${{ matrix.target }}/release/libcorvid.dylib" | tail -1 | grep -q '@rpath/libcorvid.dylib'
          elif [ -f "target/${{ matrix.target }}/release/libcorvid.so" ]; then
            objdump -p "target/${{ matrix.target }}/release/libcorvid.so" | grep -q 'SONAME.*libcorvid.so'
          fi
      - name: Stage the FFI artifact set (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          T="${{ matrix.target }}"
          DIR="ffi-stage/corvid-ffi-${GITHUB_REF_NAME}-${T}"
          mkdir -p "${DIR}/golden"
          if [ -f "target/${T}/release/libcorvid.so" ]; then
            cp "target/${T}/release/libcorvid.so" "${DIR}/"
          else
            cp "target/${T}/release/libcorvid.dylib" "${DIR}/"
          fi
          cp crates/corvid-ffi/corvid.h "${DIR}/"
          cp crates/corvid-ffi/golden/*.txt "${DIR}/golden/"
          # the staging tree lives under ffi-stage/ so the archive (and
          # only the archive) lands at the workspace root
          tar -czf "corvid-ffi-${GITHUB_REF_NAME}-${T}.tar.gz" -C ffi-stage "corvid-ffi-${GITHUB_REF_NAME}-${T}"
          ls -l "corvid-ffi-${GITHUB_REF_NAME}-${T}.tar.gz"
      # Windows ships the DLL plus its MSVC import library
      # (corvid.dll.lib — the documented linking path for binding
      # authors; see the Windows/MSVC note in the release notes).
      - name: Stage the FFI artifact set (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $T = "${{ matrix.target }}"
          $Name = "corvid-ffi-${env:GITHUB_REF_NAME}-$T"
          $Dir = "ffi-stage/$Name"
          New-Item -ItemType Directory -Force "$Dir/golden" | Out-Null
          Copy-Item "target/$T/release/corvid.dll" "$Dir/"
          Copy-Item "target/$T/release/corvid.dll.lib" "$Dir/"
          Copy-Item crates/corvid-ffi/corvid.h "$Dir/"
          Copy-Item crates/corvid-ffi/golden/*.txt "$Dir/golden/"
          Compress-Archive -Path "$Dir" -DestinationPath "$Name.zip"
          Get-Item "$Name.zip"
      # archive FILES only — a bare `corvid-ffi-*` glob also matches the
      # staging directory, and the download would then merge the
      # directory tree into dist/ alongside the archives (the first
      # dry-run failed sha256sum on exactly that).
      - name: Upload FFI archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: corvid-ffi-${{ matrix.target }}
          path: |
            corvid-ffi-*.tar.gz
            corvid-ffi-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the workspace version
        run: |
          VERSION=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/[";]/,"",$3); print $3; exit}' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::workspace version not found in Cargo.toml"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A dispatch run has no tag (GITHUB_REF_NAME is the branch), so
            # the tag<->version equality cannot be evaluated here; only the
            # version-constant half of the check runs. The equality itself is
            # enforced on the tag push that triggers a real release.
            echo "dispatch (dry_run=${{ inputs.dry_run }}): no tag context; workspace version constant: ${VERSION}; tag<->version equality enforced on tag pushes"
          else
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag: ${GITHUB_REF_NAME} (version part: ${TAG}), workspace version: ${VERSION}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${VERSION}"
              exit 1
            fi
          fi
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate sha256 checksums
        run: |
          cd dist
          ls -l
          sha256sum corvid-mcp-* corvid-ffi-* > checksums.txt
          cat checksums.txt
      - name: "dry-run: publish skipped"
        if: inputs.dry_run == true
        run: >
          echo "dry-run: publish skipped — matrix builds (mcp binaries +
          FFI cdylib/header/golden sets), version verification, and sha256
          checksums all ran; no GitHub release created, no assets uploaded."
      - name: Create the release (idempotent) and attach assets
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/corvid-mcp-* dist/corvid-ffi-* dist/checksums.txt --clobber

  crates-io:
    name: crates.io (corvid-db)
    needs: release
    # Tag pushes only (a dispatch run has no tag context), never on dry_run.
    # Runs strictly after the GitHub release exists, so the crate lands only
    # once the binary/FFI artifacts it documents are already published.
    if: github.event_name == 'push' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE — one-time secret (see scripts/bindings/README.md "USER
    # INSTRUCTIONS"): create a publish-update-scoped token at
    # https://crates.io/settings/tokens, then:
    #   gh secret set CARGO_REGISTRY_TOKEN -R corvid-db/corvid
    # cargo reads CARGO_REGISTRY_TOKEN from the environment for crates.io.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Idempotence guard (skip if the version is already on crates.io)
        id: guard
        run: |
          VERSION=$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/[";]/,"",$3); print $3; exit}' Cargo.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::workspace version not found in Cargo.toml"
            exit 1
          fi
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                      -A 'corvid-db/corvid release workflow (github.com/corvid-db/corvid)' \
                      "https://crates.io/api/v1/crates/corvid-db/$VERSION")
          echo "crates.io lookup: corvid-db $VERSION -> HTTP $CODE"
          case "$CODE" in
            200)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::corvid-db $VERSION is already on crates.io — publish skipped (idempotent re-run)"
              ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected crates.io API status $CODE (is the registry down?)"
              exit 1
              ;;
          esac
      - name: cargo publish -p corvid-db
        if: steps.guard.outputs.skip != 'true'
        run: cargo publish -p corvid-db
