name: CI

on:
  push:
    branches: [master]
  pull_request:

# New pushes to a ref supersede the in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Zero-dep posture (Task 11)
        run: |
          cargo build -p corvid --no-default-features
          if cargo tree -p corvid --edges normal | grep -qE '(^|[^a-z-])tracing v'; then
            echo "::error::tracing must not be in the default dependency graph (feature leak)"
            exit 1
          fi
      - name: Feature-gated tracing (clippy + doc + test with the feature on)
        run: |
          cargo clippy -p corvid --features tracing --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc -p corvid --features tracing --no-deps
          cargo test -p corvid --features tracing
      - name: Docs
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test
        run: cargo test --workspace

  coverage:
    name: coverage (>= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Coverage gate
        run: cargo llvm-cov --workspace --fail-under-lines 90

  wasm:
    name: wasm build (< 2 MB gzipped)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM bundle
        run: cargo build -p corvid-wasm --target wasm32-unknown-unknown --profile wasm-release
      - name: WASM graph excludes tracing (Task 11)
        run: |
          if cargo tree -p corvid-wasm --target wasm32-unknown-unknown --edges normal | grep -qE '(^|[^a-z-])tracing v'; then
            echo "::error::tracing must never reach the wasm dependency graph"
            exit 1
          fi
      - name: Enforce bundle-size budget
        run: |
          WASM=target/wasm32-unknown-unknown/wasm-release/corvid_wasm.wasm
          GZ=$(gzip -9 -c "$WASM" | wc -c)
          echo "gzipped bundle: $GZ bytes"
          if [ "$GZ" -gt 2097152 ]; then
            echo "::error::WASM bundle $GZ bytes exceeds the 2 MB gzipped budget"
            exit 1
          fi

  mobile-android:
    name: mobile cross-compile (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Build engine for aarch64-android
        run: cargo build -p corvid --target aarch64-linux-android --release

  mobile-ios:
    name: mobile cross-compile (iOS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build engine for aarch64-ios
        run: cargo build -p corvid --target aarch64-apple-ios --release
