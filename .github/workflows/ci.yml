name: CI

on:
  push:
    branches: [master]
  pull_request:

# New pushes to a ref supersede the in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings
      - name: Zero-dep posture (Task 11 + Task 5)
        run: |
          cargo build -p corvid-db --no-default-features
          if cargo tree -p corvid-db --edges normal | grep -qE '(^|[^a-z-])tracing v'; then
            echo "::error::tracing must not be in the default dependency graph (feature leak)"
            exit 1
          fi
          if cargo tree -p corvid-db --edges normal | grep -qE '(^|[^a-z-])zstd v'; then
            echo "::error::zstd must not be in the default dependency graph (feature leak)"
            exit 1
          fi
      - name: Feature-gated tracing (clippy + doc + test with the feature on)
        run: |
          cargo clippy -p corvid-db --features tracing --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc -p corvid-db --features tracing --no-deps
          cargo test -p corvid-db --features tracing
      - name: Feature-gated zstd (clippy + doc + test with the feature on)
        run: |
          cargo clippy -p corvid-db --features zstd --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc -p corvid-db --features zstd --no-deps
          cargo test -p corvid-db --features zstd
      - name: Feature composition (tracing + zstd together)
        run: |
          cargo clippy -p corvid-db --features tracing,zstd --all-targets -- -D warnings
          cargo test -p corvid-db --features tracing,zstd
      - name: Docs
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test
        run: cargo test --workspace

  coverage:
    name: coverage (>= 90%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Coverage gate
        run: cargo llvm-cov --workspace --fail-under-lines 90

  wasm:
    name: wasm build (< 2 MB gzipped)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM bundle
        run: cargo build -p corvid-wasm --target wasm32-unknown-unknown --profile wasm-release
      - name: WASM graph excludes tracing and zstd (Task 11 + Task 5)
        run: |
          if cargo tree -p corvid-wasm --target wasm32-unknown-unknown --edges normal | grep -qE '(^|[^a-z-])tracing v'; then
            echo "::error::tracing must never reach the wasm dependency graph"
            exit 1
          fi
          if cargo tree -p corvid-wasm --target wasm32-unknown-unknown --edges normal | grep -qE '(^|[^a-z-])zstd v'; then
            echo "::error::zstd must never reach the wasm dependency graph (C FFI via cc)"
            exit 1
          fi
      - name: Enforce bundle-size budget
        run: |
          WASM=target/wasm32-unknown-unknown/wasm-release/corvid_wasm.wasm
          GZ=$(gzip -9 -c "$WASM" | wc -c)
          echo "gzipped bundle: $GZ bytes"
          if [ "$GZ" -gt 2097152 ]; then
            echo "::error::WASM bundle $GZ bytes exceeds the 2 MB gzipped budget"
            exit 1
          fi

  # Mobile coverage, check-level (no linker involved): every PR proves the
  # FFI crate — which pulls the whole engine — still compiles for the
  # platform consumers' targets. The full artifact builds (NDK cdylibs,
  # the CorvidEngine.xcframework) live in release.yml; these jobs catch a
  # dependency breaking a mobile target at PR time, not release time.
  mobile-android:
    name: mobile cross-compile (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Check corvid-ffi for both Android ABIs
        run: |
          cargo check -p corvid-ffi --release --target aarch64-linux-android
          cargo check -p corvid-ffi --release --target x86_64-linux-android

  mobile-apple:
    name: mobile cross-compile (Apple)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check corvid-ffi for all five Apple targets
        run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin; do
            cargo check -p corvid-ffi --release --target "$t"
          done

  # The C ABI's own gate (Phase-0 Task 8): build the cdylib consumers
  # actually link (release profile, the artifact shape the release
  # pipeline ships — libcorvid.so / libcorvid.dylib / corvid.dll) on
  # each host OS, then run the crate's suite in the SAME profile so the
  # C smoke suite compiles c/smoke.c against that fresh library with
  # the host's native C compiler (gcc / clang / MSVC cl — the MSVC leg
  # links the emitted import library corvid.dll.lib and resolves
  # corvid.dll at load time via PATH; see src/smoke.rs). The ubuntu
  # check job already runs the crate in debug; this matrix is the
  # per-OS, per-compiler, release-profile half.
  ffi-smoke:
    name: ffi cdylib + C smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the release cdylib (the shipped artifact shape)
        run: cargo build -p corvid-ffi --release
      - name: Verify the FFI.md §8 artifact names
        if: runner.os != 'Windows'
        run: |
          ls -l target/release/libcorvid.so target/release/libcorvid.dylib 2>/dev/null || true
          test -f target/release/libcorvid.so || test -f target/release/libcorvid.dylib
      - name: Verify the FFI.md §8 artifact names (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-Item target/release/corvid.dll, target/release/corvid.dll.lib
        shell: pwsh
      - name: Crate suite (smoke + radar) in release, against the fresh library
        run: cargo test -p corvid-ffi --release

  # The sanitizer half of the C-surface gate: the identical smoke suite
  # under ASan + UBSan on the C side and `-Zsanitizer=address` on the
  # Rust side, with the LeakSanitizer gate ON (Linux carries the leak
  # half for the whole matrix — macOS arm64's runtime has no LSan, so
  # its leg of ffi-smoke covers ASan+UBSan only; x86_64 macOS would
  # leak-check too when run there). Zero leaks is the contract: every
  # handle family's free path executes inside the golden fixtures
  # (src/smoke.rs's leak-expectation notes).
  ffi-sanitize:
    name: ffi C smoke ASan + UBSan + LSan (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Sanitized smoke suite (leak gate on)
        env:
          RUSTFLAGS: -Zsanitizer=address
          CORVID_SMOKE_ASAN: "1"
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        # --target (the host triple) keeps RUSTFLAGS on TARGET artifacts
        # only: a host build would push the sanitizer flag into proc
        # macros and fail with `can't find crate for thiserror_impl`.
        # The smoke's artifact lookup knows the --target layout
        # (target/<triple>/debug) and self-builds the instrumented
        # cdylib if cargo test did not emit it (src/smoke.rs).
        run: >
          cargo test -p corvid-ffi --target x86_64-unknown-linux-gnu
          smoke_asan --lib -- --nocapture
