[workspace]
resolver = "3"
members = ["crates/corvid", "crates/corvid-mcp"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Rocky <smrockypk@gmail.com>"]
repository = "https://github.com/rocky/corvid"

[workspace.dependencies]
redb = "4.1"
thiserror = "2"
tempfile = "3"
serde_json = "1"
corvid = { path = "crates/corvid" }
