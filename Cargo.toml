[workspace]
resolver = "3"
members = [
    "crates/corvid",
    "crates/corvid-ffi",
    "crates/corvid-mcp",
    "crates/corvid-wasm",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Rocky <smrockypk@gmail.com>"]
repository = "https://github.com/corvid-db/corvid"
keywords = ["database", "embedded", "vector", "search", "ai"]
categories = ["database-implementations"]

[workspace.dependencies]
redb = "4.1"
thiserror = "2"
tempfile = "3"
serde_json = "1"
# Default features trimmed for the optional instrumentation feature (Task
# 11): span!/event! only, so the attributes proc-macro tree stays out.
# `std` stays on: the feature's own tests install per-test recorders via
# thread-local default subscribers (`subscriber::set_default`), which
# tracing gates behind `std` (this pulls `once_cell` into the feature's
# graph only — the default build and the WASM target never see any of it).
tracing = { version = "0.1", default-features = false, features = ["std"] }
# OPTIONAL value compression (ledger-closure Task 5): never in the default
# build, the WASM budget, or the zero-dependency posture — pulled in only by
# `-p corvid --features zstd` (see crates/corvid/Cargo.toml `[features]` and
# `src/compression.rs`). Defaults trimmed to the one-shot bulk codec: the
# `legacy` (old-format frames) and `zdict_builder` features stay out — corvid
# reads only frames it wrote itself and trains no dictionaries.
zstd = { version = "0.13", default-features = false }
corvid = { path = "crates/corvid" }
# Header generator for the C ABI crate (corvid-ffi): dev/test-only, exact-
# pinned because its output formatting is byte-drift-gated against the
# committed crates/corvid-ffi/corvid.h. Defaults trimmed to the library API
# (no clap — the CLI front door stays out of the workspace graph).
cbindgen = { version = "=0.29.4", default-features = false }
# C-compiler abstraction for the corvid-ffi smoke suite (Task 7): a
# TEST-RUNTIME library there (it picks cc/clang/cl and the flag dialect
# for compiling c/smoke.c and linking the just-built cdylib by path —
# no build.rs, so nothing ever links into the shipped artifact).
cc = "1.3"

# Size-optimized profile for the WASM bundle (keeps it under the 2 MB gzipped
# budget). Used via `cargo build -p corvid-wasm --target wasm32-unknown-unknown
# --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
