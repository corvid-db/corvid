[package]
# The crates.io name: bare `corvid` is taken by an unrelated crate, so the
# package publishes as `corvid-db` (org-aligned with github.com/corvid-db).
# The LIB target below keeps the ident `corvid`, so every `use corvid::…`
# in this workspace, the bindings, and downstream code is unchanged — only
# the dependency KEY in consumers' Cargo.toml says `corvid-db`.
name = "corvid-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Embedded multi-modal data store with a fluent builder API"
documentation = "https://corvid-db.github.io/docs/"
readme = "../../README.md"

[lib]
# Preserves the pre-publish crate ident: package `corvid-db`, but the
# compiled library is still `corvid` (libcorvid.rlib, `use corvid::…`).
name = "corvid"

[dependencies]
redb.workspace = true
thiserror.workspace = true
# OPTIONAL instrumentation (Task 11): never in the default build, the WASM
# budget, or the zero-dependency posture — pulled in only by
# `--features tracing` (see `[features]` and `src/telemetry.rs`). The
# workspace entry trims tracing's defaults: the engine instruments via the
# `span!`/`event!` macros only, so the `attributes` proc-macro feature
# (and its syn/quote tree) is left out; the footprint is the facade +
# `tracing-core` (+ `once_cell`, via the `std` the feature's per-test
# recorders need — see the workspace entry).
tracing = { workspace = true, optional = true }
# OPTIONAL value compression (ledger-closure Task 5), same discipline as
# tracing above: the default build keeps the zero-dependency posture (redb +
# thiserror only) and the WASM size budget — the zstd crate (C FFI via cc)
# enters ONLY via `--features zstd`. The workspace entry trims its defaults
# (no legacy-format decoder, no dictionary builder); see `src/compression.rs`
# for the on-disk marker scheme.
zstd = { workspace = true, optional = true }

[features]
## Structured instrumentation at the engine's load-bearing points (index
## backfill pages, compactions, lazy resumes/adjacency rebuilds, query plan
## selection, edge-cascade fallbacks). OFF by default: the default build
## keeps the zero-dependency posture and the WASM size budget; enabling adds
## the `tracing` facade (span!/event! only — the attributes proc-macro
## feature is disabled) and no public API. All call sites go through
## `src/telemetry.rs`, which compiles to nothing when off.
tracing = ["dep:tracing"]
## Transparent zstd compression of stored DOCUMENT values (user-collection
## records at/above `compression::THRESHOLD` bytes, level
## `compression::LEVEL`), decompressed on every read path. OFF by default:
## the default build's stored bytes are byte-identical to the pre-feature
## engine and stay free of the C-FFI dependency; ON rows carry a
## self-describing leading marker (`compression::MARKER`) that no Value
## encoding can produce, so OFF-written rows read fine and dump output is
## format-stable either way. No public API: pure crate configuration.
zstd = ["dep:zstd"]

[dev-dependencies]
tempfile.workspace = true
proptest = "1"
criterion = "0.5"

[[bench]]
name = "engine"
harness = false
