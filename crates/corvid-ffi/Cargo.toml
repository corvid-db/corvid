[package]
name = "corvid-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The typed C ABI (cdylib `corvid` + generated corvid.h) over the corvid engine — docs/FFI.md is the locked contract"

[lib]
# The cdylib artifact must be `libcorvid.so` / `libcorvid.dylib` /
# `corvid.dll` (FFI.md §8), and cargo names artifacts after the LIB TARGET
# name — hence `corvid` here even though the package is `corvid-ffi`.
#
# crate-type is cdylib only (no rlib): an rlib named `corvid` would collide
# with the engine's `libcorvid.rlib` in the shared target dir (cargo warns
# about the filename today and reserves the right to error), and it would
# make `corvid` ambiguous in any integration test's extern prelude — the
# engine dependency and this crate's own lib share that name. All tests are
# therefore unit tests inside src/.
name = "corvid"
crate-type = ["cdylib"]
# Two workspace libs cannot both rustdoc into target/doc/corvid; the engine
# keeps the workspace doc slot. `cargo doc -p corvid-ffi` is VACUOUS under
# doc = false (it emits nothing), so this crate's doc gate invokes rustdoc
# on the lib target directly — verified non-vacuous (it fails on warnings):
#   cargo rustdoc -p corvid-ffi --lib -- -D warnings
doc = false

[dependencies]
corvid.workspace = true

[dev-dependencies]
cbindgen.workspace = true
tempfile.workspace = true
# Test-only: compiles c/smoke.c at TEST RUNTIME and links the just-built
# cdylib by path (src/smoke.rs — the cc crate used as a library, not the
# build-script usage; nothing is ever linked into the shipped cdylib).
cc.workspace = true
# Test-only: the variant-inventory snapshot test (src/error.rs) constructs
# one instance of every engine error, and six of the eighteen variants wrap
# redb's passthrough error types — redb's public error enums are the only
# constructors. Pinned to the engine's workspace version (one resolution).
redb.workspace = true
